<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060a17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <title>Mega Tehnik Elektronik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      background-color: #060a17;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    #root {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }

    #pwa-boot-loader {
      display: none;
    }

    @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
      #pwa-boot-loader {
        position: fixed;
        inset: 0;
        background: #060a17;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #ffffff;
        z-index: 99999;
      }
    }

    @keyframes pwaBarPulse {
      0% {
        width: 10%;
        transform: translateX(-50%);
      }

      50% {
        width: 60%;
        transform: translateX(50%);
      }

      100% {
        width: 100%;
        transform: translateX(150%);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- PWA / App Boot Screen (Only visible in Installed App / PWA container, hidden on standard Web) -->
    <div id="pwa-boot-loader">
      <img src="/logo.webp" alt="Mega Tehnik Elektronik"
        style="width:110px;height:110px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 0 16px rgba(33,150,243,0.4));" />
      <div style="font-size:20px;font-weight:900;letter-spacing:1.5px;">MEGA TEHNIK</div>
      <div style="font-size:12px;font-weight:700;color:#2196F3;letter-spacing:3px;margin:4px 0 14px;">ELEKTRONIK</div>
      <div
        style="width:160px;height:4px;background:#0f172a;border-radius:999px;overflow:hidden;border:1px solid #1e293b;position:relative;">
        <div
          style="position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#0D47A1,#2196F3,#90CAF9);border-radius:999px;animation:pwaBarPulse 1.2s infinite ease-in-out;">
        </div>
      </div>
    </div>
  </div>

  <script>
    // Show boot loader ONLY if running as an installed PWA or Native App
    (function () {
      try {
        var isApp = (
          (window.matchMedia && (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches
          )) ||
          window.navigator.standalone === true ||
          (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
          document.referrer.indexOf('android-app://') !== -1 ||
          location.search.indexOf('source=pwa') !== -1 ||
          location.search.indexOf('source=twa') !== -1
        );
        if (isApp) {
          var loader = document.getElementById('pwa-boot-loader');
          if (loader) loader.style.display = 'flex';
        }
      } catch (e) { }
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
