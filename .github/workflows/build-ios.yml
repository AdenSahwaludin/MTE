name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Kompilasi iOS WAJIB macOS + Xcode (syarat Apple) — jalan di runner macOS GitHub
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Web Assets (Vite)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'libsql://mega-teknik-elektronik-adensahwaludin.aws-ap-northeast-1.turso.io' }}
          TOKEN_TURSO: ${{ secrets.TOKEN_TURSO || 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODcxNDg4MDYsImlkIjoiMDFhMDFhNWUtOGIwMS03NzgwLTliYjQtOTQ5YWIxYTk1M2VlIiwia2lkIjoiRVBsci1WZXk4cFpncEZUYmdmc3NmTXVMNUgzUWhDQVdzQk9sS204blJtMCIsInJpZCI6IjFmYTdhZmNlLWQ5ZWQtNDBmYi1hNThmLTUyZmE0OTNlZDNmYSJ9.-s_67DnajXUNcB9u4QBs-rz4HANrTWqICLWadCQ834fKIogiVv2Iut8KYAxeriYvRoL79HDoIfBtJ89u9ARhDg' }}
          VITE_TURSO_DATABASE_URL: ${{ secrets.DATABASE_URL || 'libsql://mega-teknik-elektronik-adensahwaludin.aws-ap-northeast-1.turso.io' }}
          VITE_TURSO_AUTH_TOKEN: ${{ secrets.TOKEN_TURSO || 'eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODcxNDg4MDYsImlkIjoiMDFhMDFhNWUtOGIwMS03NzgwLTliYjQtOTQ5YWIxYTk1M2VlIiwia2lkIjoiRVBsci1WZXk4cFpncEZUYmdmc3NmTXVMNUgzUWhDQVdzQk9sS204blJtMCIsInJpZCI6IjFmYTdhZmNlLWQ5ZWQtNDBmYi1hNThmLTUyZmE0OTNlZDNmYSJ9.-s_67DnajXUNcB9u4QBs-rz4HANrTWqICLWadCQ834fKIogiVv2Iut8KYAxeriYvRoL79HDoIfBtJ89u9ARhDg' }}
        run: bun run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      # Build TANPA tanda tangan (unsigned): .ipa-nya bisa dipakai setelah
      # ditandatangani — gratis via Sideloadly/AltStore (Apple ID biasa,
      # berlaku 7 hari) atau Xcode, resmi via Apple Developer $99/tahun
      # (TestFlight / App Store).
      # Pakai -scheme (shared scheme App.xcscheme) — opsi -derivedDataPath
      # tidak valid untuk build -target (xcodebuild exit 64).
      - name: Build iOS App (unsigned, device)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ios-derived/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -qry Mega-Teknik-POS-iOS-unsigned.ipa Payload
          ls -lh Mega-Teknik-POS-iOS-unsigned.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mega-Teknik-POS-iOS-unsigned-IPA
          path: build/Mega-Teknik-POS-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
